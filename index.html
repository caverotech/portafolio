<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS no usa el SVG: sin apple-touch-icon, al añadir la web a la
         pantalla de inicio pone una captura reducida de la página. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ══════════════════════════════════════════════════════════
         SEO — BÚSQUEDA
         El título y la descripción son lo que se lee en Google.
         Llevan los términos con los que alguien busca este trabajo
         ("full stack", "IA", "automatización", "agentes") y el lugar
         ("Ica", "Perú"), porque la búsqueda local es donde hay menos
         competencia y más intención de contratar.
         ══════════════════════════════════════════════════════════ -->
    <title>Alexys Cavero · Desarrollador Full Stack, IA y Automatización en Perú</title>
    <meta
      name="description"
      content="Desarrollador Full Stack especializado en IA y automatización, en Ica, Perú. Construyo agentes de IA, automatizo procesos con n8n y Claude, e integro LLMs en sistemas reales — con la interfaz que los hace usables. Trabajo remoto en todo Perú."
    />
    <meta name="author" content="Alexys Cavero" />
    <link rel="canonical" href="https://www.caverotech.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Verificación de propiedad en Google Search Console. No borrar:
         sin ella Search Console pierde el acceso a los datos del sitio. -->
    <meta name="google-site-verification" content="DAYzSttTQiXV0BbYW9UYLA2wlVS6qsYrIm5Y126mmQI" />

    <!-- Cobertura geográfica: refuerza las búsquedas locales -->
    <meta name="geo.region" content="PE-ICA" />
    <meta name="geo.placename" content="Ica, Perú" />

    <!-- ══════════════════════════════════════════════════════════
         REDES SOCIALES
         og:image es la tarjeta que aparece al compartir el enlace en
         WhatsApp, LinkedIn o Twitter. Sin ella el enlace se ve como
         texto plano y nadie lo abre.
         ══════════════════════════════════════════════════════════ -->
    <meta property="og:site_name" content="Alexys Cavero · caverotech.com" />
    <meta property="og:title" content="Alexys Cavero · Full Stack, IA y Automatización" />
    <meta
      property="og:description"
      content="Agentes de IA, automatización de procesos con n8n e integración de LLMs en sistemas que funcionan en producción. Ica, Perú."
    />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://www.caverotech.com/" />
    <meta property="og:locale" content="es_PE" />
    <!-- Tarjeta 1200x630 (1.91:1), la proporción que usan LinkedIn,
         WhatsApp y X. Foto-2026.jpeg es cuadrada, así que al recortarla
         a ese formato se perdía parte de la cara. La genera
         scripts/og.py a partir del mismo retrato, sin modificarlo. -->
    <meta property="og:image" content="https://www.caverotech.com/og-2026.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Alexys Cavero, Desarrollador Full Stack en IA y Automatización" />
    <meta property="profile:first_name" content="Alexys" />
    <meta property="profile:last_name" content="Cavero" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alexys Cavero · Full Stack, IA y Automatización" />
    <meta
      name="twitter:description"
      content="Agentes de IA, automatización con n8n e integración de LLMs. Ica, Perú."
    />
    <meta name="twitter:image" content="https://www.caverotech.com/og-2026.jpg" />
    <meta name="twitter:image:alt" content="Alexys Cavero, Desarrollador Full Stack en IA y Automatización" />

    <meta name="theme-color" content="#0A0B0D" />

    <!-- Fondo oscuro desde el primer instante: evita el destello blanco
         antes de que React pinte. -->
    <style>
      html, body, #root { background-color: #0A0B0D; }
      body { margin: 0; }
    </style>

    <!-- Tipografía: Geist (display y cuerpo) + Geist Mono (ficha técnica).
         Dos familias, sin serif: lenguaje contemporáneo de producto.

         Servidas desde el propio dominio (public/fonts/, licencia OFL)
         en vez de desde Google Fonts: su hoja de estilos bloqueaba el
         primer pintado ~0,8 s en móvil mientras se resolvía otro
         dominio. Son fuentes variables: un archivo cubre todos los
         pesos. Solo los juegos latin y latin-ext, que es lo que usa el
         español; el resto de alfabetos no se descargaba nunca. -->
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Geist"; font-style: normal; font-weight: 300 700; font-display: swap;
        src: url(/fonts/geist-latin-ext.woff2) format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Geist"; font-style: normal; font-weight: 300 700; font-display: swap;
        src: url(/fonts/geist-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Geist Mono"; font-style: normal; font-weight: 400 500; font-display: swap;
        src: url(/fonts/geist-mono-latin-ext.woff2) format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Geist Mono"; font-style: normal; font-weight: 400 500; font-display: swap;
        src: url(/fonts/geist-mono-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <!-- ══════════════════════════════════════════════════════════
         DATOS ESTRUCTURADOS
         Le dicen a Google QUÉ es esto, no solo qué palabras tiene.
         Son tres objetos enlazados:
           Person       → quién soy, dónde estoy, qué sé hacer
           ProfilePage  → esta página ES el perfil de esa persona
           Service      → el servicio que ofrezco y dónde lo ofrezco
         `areaServed` es la pieza que conecta con "en Ica", "en Lima",
         "en Perú": sin ella Google no sabe tu cobertura.
         ══════════════════════════════════════════════════════════ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://www.caverotech.com/#alexys",
            "name": "Alexys Cavero",
            "alternateName": [
              "Gustavo Alexys Cavero Quispe",
              "Alexys Cavero Quispe",
              "Alexys Cavero Q.",
              "Cavero Tech",
              "caverotech"
            ],
            "givenName": "Alexys",
            "additionalName": "Gustavo",
            "familyName": "Cavero Quispe",
            "url": "https://www.caverotech.com/",
            "image": {
              "@type": "ImageObject",
              "url": "https://www.caverotech.com/Foto-2026.jpeg",
              "caption": "Alexys Cavero, Desarrollador Full Stack en IA y Automatización"
            },
            "jobTitle": "Desarrollador Full Stack, IA y Automatización",
            "description": "Desarrollador Full Stack especializado en IA y automatización, en Ica, Perú. Construyo agentes de IA, automatizo procesos con n8n y Claude, e integro modelos de lenguaje en sistemas de producción.",
            "email": "mailto:ing.alexyscavero@gmail.com",
            "knowsLanguage": ["es", "en"],
            "knowsAbout": [
              "Inteligencia Artificial",
              "Agentes de IA",
              "Modelos de Lenguaje (LLMs)",
              "Automatización de procesos",
              "Model Context Protocol (MCP)",
              "n8n",
              "Claude",
              "OpenAI GPT",
              "Integración de APIs",
              "React",
              "Supabase",
              "SQL Server",
              "Desarrollo web"
            ],
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Ica",
              "addressRegion": "Ica",
              "addressCountry": "PE"
            },
            "worksFor": {
              "@type": "Organization",
              "name": "Conecta Systems",
              "description": "Automatización de procesos y desarrollo de software a medida para negocios."
            },
            "alumniOf": {
              "@type": "CollegeOrUniversity",
              "name": "Universidad Tecnológica del Perú"
            },
            "sameAs": [
              "https://github.com/caverotech",
              "https://www.linkedin.com/in/caverotech",
              "https://www.youtube.com/channel/UCjpDH64aFdqoR5coCUfWYLg",
              "https://www.calameo.com/accounts/6278194"
            ]
          },
          {
            "@type": "ProfilePage",
            "@id": "https://www.caverotech.com/#pagina",
            "url": "https://www.caverotech.com/",
            "name": "Alexys Cavero · Desarrollador Full Stack, IA y Automatización",
            "inLanguage": "es-PE",
            "mainEntity": { "@id": "https://www.caverotech.com/#alexys" },
            "about": { "@id": "https://www.caverotech.com/#alexys" }
          },
          {
            "@type": "Service",
            "@id": "https://www.caverotech.com/#servicio",
            "name": "Automatización de procesos y agentes de IA",
            "serviceType": "Ingeniería de IA y automatización de procesos",
            "description": "Diseño e implementación de agentes de IA, flujos automatizados con n8n e integración de modelos de lenguaje en los sistemas de un negocio, con la interfaz que los hace usables.",
            "provider": { "@id": "https://www.caverotech.com/#alexys" },
            "areaServed": [
              { "@type": "City", "name": "Ica" },
              { "@type": "City", "name": "Lima" },
              { "@type": "Country", "name": "Perú" }
            ],

            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.caverotech.com/#sitio",
            "url": "https://www.caverotech.com/",
            "name": "Alexys Cavero · caverotech.com",
            "alternateName": ["Cavero Tech", "caverotech"],
            "inLanguage": "es-PE",
            "publisher": { "@id": "https://www.caverotech.com/#alexys" },
            "author": { "@id": "https://www.caverotech.com/#alexys" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- Respaldo para quien navegue sin JavaScript.
         Desde que el build prerenderiza cada ruta (scripts/prerender.mjs),
         el HTML ya llega con el contenido real, así que este bloque dejó
         de ser el único texto disponible y pasó a ser una red de
         seguridad con los datos de contacto.
         Ojo: aquí NO va un encabezado de primer nivel. El de cada
         página es el de su contenido prerenderizado; poner otro aquí
         daba dos en la portada y rompía la jerarquía. -->
    <noscript>
      <div style="max-width: 46rem; margin: 0 auto; padding: 3rem 1.5rem; color: #EDEFF2; font-family: system-ui, sans-serif; line-height: 1.6;">
        <p style="font-size: 2rem; letter-spacing: -0.03em; font-weight: 600;">Alexys Cavero</p>
        <p style="color: #E8983E; font-weight: 600;">Desarrollador Full Stack · IA y Automatización · Perú</p>
        <p>
          Construyo agentes de IA y flujos automatizados que reemplazan trabajo
          manual, y la interfaz que los vuelve usables. Trabajo con Claude, MCP,
          n8n, React y Supabase, para negocios de todo el Perú.
        </p>
        <p>
          Esta web necesita JavaScript para mostrarse completa. Puedes
          escribirme a
          <a href="mailto:ing.alexyscavero@gmail.com" style="color: #E8983E;">ing.alexyscavero@gmail.com</a>
          o ver mi trabajo en
          <a href="https://github.com/caverotech" style="color: #E8983E;">GitHub</a>
          y
          <a href="https://www.linkedin.com/in/caverotech" style="color: #E8983E;">LinkedIn</a>.
        </p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
